<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NumPy 숫자 인식기</title>
<style>body{font:16px system-ui;max-width:860px;margin:40px auto;padding:20px;background:#f4f6fb;color:#182134}h1{font-size:28px}.panels{display:flex;flex-wrap:wrap;gap:32px}canvas{background:#000;border-radius:12px;touch-action:none}button{padding:12px 22px;margin:12px 6px 12px 0;border:0;border-radius:8px;cursor:pointer;background:#2457c5;color:white}#preview{image-rendering:pixelated;width:168px;height:168px}#result{font-size:24px}li{display:flex;gap:10px;align-items:center}progress{width:170px}#message{min-height:30px}</style>
<h1>직접 그려 보는 NumPy 숫자 인식기</h1><p>한 자리 숫자를 크게 그려 주세요. 오른쪽에서 실제 입력 이미지와 예측 점수를 확인할 수 있습니다.</p>
<div class="panels"><section><canvas id="drawing" width="280" height="280" aria-label="숫자 그리기 영역"></canvas><br><button id="predict">판별</button><button id="clear">지우기</button></section><section><h2>모델 입력 · 28 × 28</h2><canvas id="preview" width="28" height="28"></canvas><p id="result">숫자를 그려 주세요</p></section><ol id="scores"></ol></div><p id="message" role="status"></p><p>MNIST로 학습한 MLP입니다. 손으로 그린 숫자는 학습 데이터와 다를 수 있으며, 점수는 보정된 신뢰도가 아닙니다.</p>
<script type="module">
const drawing=document.querySelector('#drawing'),ctx=drawing.getContext('2d'),preview=document.querySelector('#preview'),out=preview.getContext('2d');let active=false;
function clear(){ctx.fillStyle='black';ctx.fillRect(0,0,280,280);out.clearRect(0,0,28,28);document.querySelector('#result').textContent='숫자를 그려 주세요';document.querySelector('#scores').replaceChildren();document.querySelector('#message').textContent=''}clear();
function point(e){const r=drawing.getBoundingClientRect();return [(e.clientX-r.left)*280/r.width,(e.clientY-r.top)*280/r.height]}
drawing.onpointerdown=e=>{active=true;drawing.setPointerCapture(e.pointerId);ctx.strokeStyle='white';ctx.fillStyle='white';ctx.lineWidth=18;ctx.lineCap='round';const [x,y]=point(e);ctx.beginPath();ctx.arc(x,y,9,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.moveTo(x,y)};
drawing.onpointermove=e=>{if(active){ctx.lineTo(...point(e));ctx.stroke()}};drawing.onpointerup=drawing.onpointercancel=()=>active=false;
document.querySelector('#clear').onclick=clear;document.querySelector('#predict').onclick=async()=>{const button=document.querySelector('#predict');button.disabled=true;try{const response=await fetch('/predict',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image:drawing.toDataURL('image/png')})});const result=await response.json();if(!response.ok)throw Error(result.error);const frame=out.createImageData(28,28);result.pixels.flat().forEach((v,i)=>{frame.data[i*4]=frame.data[i*4+1]=frame.data[i*4+2]=v;frame.data[i*4+3]=255});out.putImageData(frame,0,0);document.querySelector('#result').textContent=`예측 숫자: ${result.digit}`;document.querySelector('#scores').replaceChildren(...result.scores.map((p,i)=>{const li=document.createElement('li'),bar=document.createElement('progress');bar.max=1;bar.value=p;li.append(`${i} `,bar,` ${(p*100).toFixed(1)}%`);return li}));document.querySelector('#message').textContent='판별 완료'}catch(e){document.querySelector('#message').textContent=e.message}finally{button.disabled=false}};
</script></html>
